[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tools"
version = "0.1.0"
description = "Reusable deterministic tools for humans and AI coding agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27,<1",
  "markdown-it-py>=3,<4",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-httpx>=0.30,<1",
]

[project.scripts]
jira-sync = "agent_tools.jira_sync.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
